global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 10s
    timeout client 5m
    timeout server 5m

frontend local_flower_tls
    bind 127.0.0.1:19092 ssl crt /run/local/server.pem ssl-min-ver TLSv1.3
    default_backend control_plane_mtls

backend control_plane_mtls
    server control-plane ${SENSEL_FLOWER_CONTROL_PLANE_HOST}:${SENSEL_FLOWER_CONTROL_PLANE_PORT} ssl crt /run/mtls/site-client.pem ca-file /run/mtls/ca.crt verify required sni str(${SENSEL_FLOWER_CONTROL_PLANE_HOST})
