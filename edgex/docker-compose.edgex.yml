      core-data:
        condition: service_started
      mqtt-broker:
        condition: service_started
      local-mqtt:
        condition: service_started
    command: ["--registry", "-cp=keeper.http://edgex-core-keeper:59890"]
    env_file:
      - ./common-non-security.env
    environment:
      SERVICE_HOST: edgex-device-mqtt
      # External MQTT for OT devices / Packet Sensor feature summaries
      MQTTBROKERINFO_HOST: local-mqtt
