# SenseL OT Edge Sensor — Main Docker Compose
# Target: Ubuntu Server (MVP / Lab)
# Pi4 overlay: docker compose -f docker-compose.yml -f docker-compose.pi4.yml up -d
# EdgeX UI (lab): docker compose --profile lab-ui up -d

name: sensel-ot-edge-sensor

include:
  - path: edgex/docker-compose.edgex.yml

services:
  # ---------------------------------------------------------------------------
  # Local MQTT Broker (feature summary → EdgeX device-mqtt)
  # ---------------------------------------------------------------------------
  local-mqtt:
    image: eclipse-mosquitto:2
    container_name: sensel-local-mqtt
    restart: unless-stopped
    volumes:
      - ./services/mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1884:1883"
    networks:
      - sensel-edge

  # ---------------------------------------------------------------------------
  # SenseL Edge Console — local setup wizard + status dashboard (OT-C1)
  # ---------------------------------------------------------------------------
  edge-console:
    build:
      context: ./services/edge-console
      dockerfile: Dockerfile
    container_name: sensel-edge-console
    restart: unless-stopped
    ports:
      - "8090:8090"
      - "8443:8443"
    environment:
      - PLATFORM_CONFIG_PATH=/data/agent/platform.json
      - ASSETS_DIR=/data/assets
      # HTTPS (self-signed) SAN list — must include the mDNS name used below.
      - CONSOLE_TLS_HOSTS=${CONSOLE_TLS_HOSTS:-sensel.local,localhost,127.0.0.1}
      - DEFAULT_SENSEL_API_KEY=${SENSEL_API_KEY:-sensel-ot-ingest-lab-2026}
      - EDGE_CONSOLE_PASSWORD=${EDGE_CONSOLE_PASSWORD:-}
      - EDGE_CONSOLE_DOCKER_RESTART=${EDGE_CONSOLE_DOCKER_RESTART:-true}
      - EDGE_CONSOLE_AUTO_RESTART_AGENT=${EDGE_CONSOLE_AUTO_RESTART_AGENT:-true}
      - EDGE_CONSOLE_NET_ADMIN=${EDGE_CONSOLE_NET_ADMIN:-true}
      - EDGE_CONSOLE_WIFI_ADMIN=${EDGE_CONSOLE_WIFI_ADMIN:-true}
      # OpenVPN client control (profiles + connect/disconnect via vpn-client sidecar)
      - EDGE_CONSOLE_VPN_ADMIN=${EDGE_CONSOLE_VPN_ADMIN:-true}
      - VPN_CLIENT_CONTAINER=sensel-vpn-client
      - VPN_STATE_DIR=/data/agent/vpn
      # Opt-in read-only active probe (TCP fingerprint + Modbus FC43) via packet-sensor
      - EDGE_CONSOLE_ACTIVE_PROBE=${EDGE_CONSOLE_ACTIVE_PROBE:-false}
      # Baseline pcap learning limits (Pi-friendly defaults)
      - BASELINE_MAX_PCAP_MB=${BASELINE_MAX_PCAP_MB:-100}
      - BASELINE_AUTO_LIMIT_MB=${BASELINE_AUTO_LIMIT_MB:-50}
      - BASELINE_AUTO_LIMIT_PACKETS=${BASELINE_AUTO_LIMIT_PACKETS:-500000}
      - BASELINE_LEARN_TIMEOUT_SEC=${BASELINE_LEARN_TIMEOUT_SEC:-600}
      - EDGE_AGENT_CONTAINER=sensel-edge-agent
      - PACKET_SENSOR_CONTAINER=sensel-packet-sensor
      - EDGEX_CORE_DATA_URL=http://edgex-core-data:59880
      - EDGEX_CORE_METADATA_URL=http://edgex-core-metadata:59881
      - EDGEX_DEVICES_DIR=/config/edgex/devices
      - EDGEX_PROFILES_DIR=/config/edgex/profiles
      - EDGEX_UI_URL=http://127.0.0.1:4000
      - EDGEX_COMPOSE_PROJECT_DIR=/project
      - EDGEX_COMPOSE_FILES=-f docker-compose.yml -f docker-compose.pi4.yml -f docker-compose.lab-61850.yml -f docker-compose.pi-lab.yml -f docker-compose.pi-reliability.yml
      - EDGE_CONSOLE_AUDIT_LOG=/data/agent/console-audit.jsonl
      - DETECTION_POLICY_PATH=/data/agent/detection-policy.json
      - DETECTION_POLICY_STAMP_PATH=/data/agent/detection-policy.stamp
      - OPERATIONAL_MODE_PATH=/data/agent/operational-mode.json
      - LEARNING_SESSION_PATH=/data/agent/learning-session.json
    volumes:
      - ./data/agent:/data/agent
      # Writable so the Console can append a synthetic "test event" into the
      # real security-events.jsonl pipeline (POST /api/test-event). packet-sensor
      # also appends here; POSIX O_APPEND keeps concurrent writes safe.
      - ./data/assets:/data/assets
      - ./config/edgex:/config/edgex
      - ./:/project:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
      # Host system D-Bus socket — lets nmcli drive the host NetworkManager
      # (Wi-Fi scan/connect). Requires NetworkManager active on host.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    networks:
      - sensel-edge
      - edgex-network
    depends_on:
      - core-data
      - core-metadata

  # ---------------------------------------------------------------------------
  # SenseL VPN Client — declarative OpenVPN sidecar (host net + tun)
  # Runs the tunnel in the HOST network namespace so pushed LAN routes apply to
  # the appliance (lets the sensor reach the remote internal network). The Edge
  # Console manages profiles + desired state on the shared ./data/agent/vpn
  # volume; this container's supervisor reconciles OpenVPN to that state and
  # self-heals on failure / restart.
  # ---------------------------------------------------------------------------
  vpn-client:
    build:
      context: ./services/vpn-client
      dockerfile: Dockerfile
    container_name: sensel-vpn-client
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_STATE_DIR=/data/agent/vpn
      - VPN_MGMT_PORT=7505
    volumes:
      - ./data/agent/vpn:/data/agent/vpn

  # ---------------------------------------------------------------------------
  # SenseL Edge Agent — platform comms, policy sync, health
  # ---------------------------------------------------------------------------
  sensel-edge-agent:
    build:
      context: ./services/sensel-edge-agent
      dockerfile: Dockerfile
    container_name: sensel-edge-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - EDGEX_CORE_DATA_URL=http://edgex-core-data:59880
      - EDGEX_CORE_METADATA_URL=http://edgex-core-metadata:59881
      - EDGEX_DEVICE_MANAGEMENT_ENABLED=${EDGEX_DEVICE_MANAGEMENT_ENABLED:-true}
      - EDGEX_INVENTORY_INTERVAL_SEC=${EDGEX_INVENTORY_INTERVAL_SEC:-60}
      - EDGEX_DESIRED_MQTT_ENABLED=${EDGEX_DESIRED_MQTT_ENABLED:-true}
      - NORTHBOUND_MQTT_ENABLED=${NORTHBOUND_MQTT_ENABLED:-false}
      - CONTROL_PLANE_MQTT_HOST=${CONTROL_PLANE_MQTT_HOST:-}
      - CONTROL_PLANE_MQTT_PORT=${CONTROL_PLANE_MQTT_PORT:-1883}
      - CONTROL_PLANE_MQTT_TLS=${CONTROL_PLANE_MQTT_TLS:-false}
      - CONTROL_PLANE_MQTT_CA_PATH=${CONTROL_PLANE_MQTT_CA_PATH:-}
      - CONTROL_PLANE_MQTT_CERT_PATH=${CONTROL_PLANE_MQTT_CERT_PATH:-}
      - CONTROL_PLANE_MQTT_KEY_PATH=${CONTROL_PLANE_MQTT_KEY_PATH:-}
      - NORTHBOUND_WIRE_MODE=${NORTHBOUND_WIRE_MODE:-json}
      - NORTHBOUND_PROTOBUF_FAILURE_THRESHOLD=${NORTHBOUND_PROTOBUF_FAILURE_THRESHOLD:-3}
      - NORTHBOUND_WIRE_ROLLBACK_RESET=${NORTHBOUND_WIRE_ROLLBACK_RESET:-false}
      - PLATFORM_CONFIG_PATH=/app/data/platform.json
      - POLICY_SYNC_ENABLED=${POLICY_SYNC_ENABLED:-true}
      - POLICY_SYNC_INTERVAL_SEC=${POLICY_SYNC_INTERVAL_SEC:-60}
      - SMB_INTEL_API_KEY=${SMB_INTEL_API_KEY:-}
      - POLICY_SYNC_TENANT_ID=${POLICY_SYNC_TENANT_ID:-}
      - IOC_CACHE_PATH=/app/data/ioc-cache.json
      - SIGHTING_REPORT_ENABLED=${SIGHTING_REPORT_ENABLED:-true}
      - SIGHTING_REPORT_INTERVAL_SEC=${SIGHTING_REPORT_INTERVAL_SEC:-10}
      - SIGHTING_QUEUE_PATH=/app/data/sighting-queue.jsonl
      - POLICY_SYNC_MQTT_ENABLED=${POLICY_SYNC_MQTT_ENABLED:-false}
      - POLICY_SYNC_MQTT_HOST=${POLICY_SYNC_MQTT_HOST:-${CONTROL_PLANE_MQTT_HOST:-}}
      - POLICY_SYNC_MQTT_PORT=${POLICY_SYNC_MQTT_PORT:-${CONTROL_PLANE_MQTT_PORT:-1883}}
      - POLICY_SYNC_MQTT_TOPIC=${POLICY_SYNC_MQTT_TOPIC:-sensel/{tenant_id}/policy/blacklist}
      - DETECTION_POLICY_MQTT_TOPIC=${DETECTION_POLICY_MQTT_TOPIC:-sensel/{tenant_id}/policy/ot-detection}
      - OPERATIONAL_MODE_PATH=/app/data/operational-mode.json
      - OPERATIONAL_MODE_STAMP_PATH=/app/data/operational-mode.stamp
      - LEARNING_SESSION_PATH=/app/data/learning-session.json
      - OPERATIONAL_MODE_MQTT_ENABLED=${OPERATIONAL_MODE_MQTT_ENABLED:-false}
      - OPERATIONAL_MODE_MQTT_TOPIC=${OPERATIONAL_MODE_MQTT_TOPIC:-sensel/{tenant_id}/cmd/{sensor_id}/operational}
      - BASELINE_PROFILE_PATH=/app/data/baseline-profile.json
      - BASELINE_PROFILE_STAMP_PATH=/app/data/baseline-profile.stamp
      - BASELINE_PROFILE_MQTT_ENABLED=${BASELINE_PROFILE_MQTT_ENABLED:-false}
      - BASELINE_PROFILE_MQTT_TOPIC=${BASELINE_PROFILE_MQTT_TOPIC:-sensel/{tenant_id}/baseline/+}
      - TOPOLOGY_OVERRIDE_PATH=/app/data/topology-asset-overrides.json
      - TOPOLOGY_OVERRIDE_STAMP_PATH=/app/data/topology-asset-overrides.stamp
      - TOPOLOGY_OVERRIDE_MQTT_ENABLED=${TOPOLOGY_OVERRIDE_MQTT_ENABLED:-false}
      - TOPOLOGY_OVERRIDE_MQTT_TOPIC=${TOPOLOGY_OVERRIDE_MQTT_TOPIC:-sensel/{tenant_id}/cmd/{sensor_id}/topology/override}
      - OBSERVE_TICK_ENABLED=${OBSERVE_TICK_ENABLED:-true}
      - OBSERVE_TICK_INTERVAL_SEC=${OBSERVE_TICK_INTERVAL_SEC:-60}
      - TOPOLOGY_SNAPSHOT_ENABLED=${TOPOLOGY_SNAPSHOT_ENABLED:-true}
      - TOPOLOGY_SNAPSHOT_INTERVAL_SEC=${TOPOLOGY_SNAPSHOT_INTERVAL_SEC:-120}
      - TOPOLOGY_SNAPSHOT_DETECT_INTERVAL_SEC=${TOPOLOGY_SNAPSHOT_DETECT_INTERVAL_SEC:-300}
      - CAPTURE_LIVE_PATH=/app/data/assets/capture-live.json
      - LIVE_OBSERVED_PATH=/app/data/assets/baseline/live-observed.json
    volumes:
      - ./config:/app/config:ro
      - ./data/agent:/app/data
      - ./data/assets:/app/data/assets:ro
    depends_on:
      local-mqtt:
        condition: service_started
      core-data:
        condition: service_started
      core-metadata:
        condition: service_started
    networks:
      - sensel-edge
      - edgex-network

  # ---------------------------------------------------------------------------
  # Packet Sensor Agent — mirror capture, parse, detect, evidence
  # ---------------------------------------------------------------------------
  packet-sensor:
    build:
      context: ./services/packet-sensor
      dockerfile: Dockerfile
      args:
        INSTALL_ML_RUNTIME: ${INSTALL_ML_RUNTIME:-false}
    container_name: sensel-packet-sensor
    restart: unless-stopped
    env_file:
      - .env
      - ./data/agent/capture.env
    volumes:
      - ./config:/app/config:ro
      - ./data/pcap:/app/data/pcap
      - ./data/assets:/app/data/assets
      - ./data/agent:/app/data/agent:ro
      - ./data/models:/app/data/models:ro
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      - IOC_MATCH_ENABLED=${IOC_MATCH_ENABLED:-true}
      - IOC_CACHE_PATH=/app/data/agent/ioc-cache.json
      - IOC_CACHE_STAMP_PATH=/app/data/agent/ioc-cache.stamp
      - IOC_MATCH_COOLDOWN_SEC=${IOC_MATCH_COOLDOWN_SEC:-300}
      - DETECTION_POLICY_PATH=/app/data/agent/detection-policy.json
      - DETECTION_POLICY_STAMP_PATH=/app/data/agent/detection-policy.stamp
      - DETECTION_POLICY_RELOAD_SEC=5
      - OPERATIONAL_MODE_PATH=/app/data/agent/operational-mode.json
      - OPERATIONAL_MODE_STAMP_PATH=/app/data/agent/operational-mode.stamp
      - BASELINE_PROFILE_PATH=/app/data/agent/baseline-profile.json
      - BASELINE_PROFILE_STAMP_PATH=/app/data/agent/baseline-profile.stamp
      - OPERATIONAL_MODE_RELOAD_SEC=5
      # Live baseline observation rolling window (drift): drop identities not
      # seen within this many seconds. 0 = accumulate since start.
      - LIVE_OBSERVE_WINDOW_SEC=${LIVE_OBSERVE_WINDOW_SEC:-900}
      - CAPTURE_BACKEND=${CAPTURE_BACKEND:-scapy}
      - XDP_MODE=${XDP_MODE:-native}
      - XDP_QUEUE_ID=${XDP_QUEUE_ID:-0}
      - AF_XDP_FRAME_SIZE=${AF_XDP_FRAME_SIZE:-2048}
      - AF_XDP_NUM_FRAMES=${AF_XDP_NUM_FRAMES:-4096}
      - MODEL_INFERENCE_ENABLED=${MODEL_INFERENCE_ENABLED:-false}
      - IF_ENABLED=${IF_ENABLED:-false}
      - XGB_ENABLED=${XGB_ENABLED:-false}
      - LSTM_ENABLED=${LSTM_ENABLED:-false}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - BPF
      - IPC_LOCK
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    depends_on:
      - local-mqtt
      - sensel-edge-agent

networks:
  sensel-edge:
    driver: bridge
  edgex-network:
    driver: bridge

volumes:
  edgex-db:
