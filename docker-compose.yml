# SenseL OT Edge Sensor — Main Docker Compose
# Target: Ubuntu Server (MVP / Lab)
# Pi4 overlay: docker compose -f docker-compose.yml -f docker-compose.pi4.yml up -d
# EdgeX UI (lab): docker compose --profile lab-ui up -d

name: sensel-ot-edge-sensor

include:
  - path: edgex/docker-compose.edgex.yml

services:
  # ---------------------------------------------------------------------------
  # Local MQTT Broker (feature summary → EdgeX device-mqtt)
  # ---------------------------------------------------------------------------
  local-mqtt:
    image: eclipse-mosquitto:2
    container_name: sensel-local-mqtt
    restart: unless-stopped
    volumes:
      - ./services/mqtt-broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1884:1883"
    networks:
      - sensel-edge

  # ---------------------------------------------------------------------------
  # SenseL Edge Console — local setup wizard + status dashboard (OT-C1)
  # ---------------------------------------------------------------------------
  edge-console:
    build:
      context: ./services/edge-console
      dockerfile: Dockerfile
    container_name: sensel-edge-console
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PLATFORM_CONFIG_PATH=/data/agent/platform.json
      - ASSETS_DIR=/data/assets
      - DEFAULT_SENSEL_API_KEY=${SENSEL_API_KEY:-sensel-ot-ingest-lab-2026}
      - EDGE_CONSOLE_PASSWORD=${EDGE_CONSOLE_PASSWORD:-}
      - EDGE_CONSOLE_DOCKER_RESTART=${EDGE_CONSOLE_DOCKER_RESTART:-true}
      - EDGE_CONSOLE_AUTO_RESTART_AGENT=${EDGE_CONSOLE_AUTO_RESTART_AGENT:-true}
      - EDGE_AGENT_CONTAINER=sensel-edge-agent
      - PACKET_SENSOR_CONTAINER=sensel-packet-sensor
    volumes:
      - ./data/agent:/data/agent
      - ./data/assets:/data/assets:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - sensel-edge

  # ---------------------------------------------------------------------------
  # SenseL Edge Agent — platform comms, policy sync, health
  # ---------------------------------------------------------------------------
  sensel-edge-agent:
    build:
      context: ./services/sensel-edge-agent
      dockerfile: Dockerfile
    container_name: sensel-edge-agent
    restart: unless-stopped
    env_file: .env
    environment:
      - EDGEX_CORE_DATA_URL=http://edgex-core-data:59880
      - NORTHBOUND_MQTT_ENABLED=${NORTHBOUND_MQTT_ENABLED:-false}
      - CONTROL_PLANE_MQTT_HOST=${CONTROL_PLANE_MQTT_HOST:-}
      - CONTROL_PLANE_MQTT_PORT=${CONTROL_PLANE_MQTT_PORT:-1883}
      - PLATFORM_CONFIG_PATH=/app/data/platform.json
      - POLICY_SYNC_ENABLED=${POLICY_SYNC_ENABLED:-true}
      - POLICY_SYNC_INTERVAL_SEC=${POLICY_SYNC_INTERVAL_SEC:-60}
      - SMB_INTEL_API_KEY=${SMB_INTEL_API_KEY:-}
      - POLICY_SYNC_TENANT_ID=${POLICY_SYNC_TENANT_ID:-}
      - IOC_CACHE_PATH=/app/data/ioc-cache.json
      - SIGHTING_REPORT_ENABLED=${SIGHTING_REPORT_ENABLED:-true}
      - SIGHTING_REPORT_INTERVAL_SEC=${SIGHTING_REPORT_INTERVAL_SEC:-10}
      - SIGHTING_QUEUE_PATH=/app/data/sighting-queue.jsonl
      - POLICY_SYNC_MQTT_ENABLED=${POLICY_SYNC_MQTT_ENABLED:-false}
      - POLICY_SYNC_MQTT_HOST=${POLICY_SYNC_MQTT_HOST:-${CONTROL_PLANE_MQTT_HOST:-}}
      - POLICY_SYNC_MQTT_PORT=${POLICY_SYNC_MQTT_PORT:-${CONTROL_PLANE_MQTT_PORT:-1883}}
      - POLICY_SYNC_MQTT_TOPIC=${POLICY_SYNC_MQTT_TOPIC:-sensel/{tenant_id}/policy/blacklist}
    volumes:
      - ./config:/app/config:ro
      - ./data/agent:/app/data
      - ./data/assets:/app/data/assets:ro
    depends_on:
      local-mqtt:
        condition: service_started
      core-data:
        condition: service_started
    networks:
      - sensel-edge
      - edgex-network

  # ---------------------------------------------------------------------------
  # Packet Sensor Agent — mirror capture, parse, detect, evidence
  # ---------------------------------------------------------------------------
  packet-sensor:
    build:
      context: ./services/packet-sensor
      dockerfile: Dockerfile
    container_name: sensel-packet-sensor
    restart: unless-stopped
    env_file:
      - .env
      - ./data/agent/capture.env
    volumes:
      - ./config:/app/config:ro
      - ./data/pcap:/app/data/pcap
      - ./data/assets:/app/data/assets
      - ./data/agent:/app/data/agent:ro
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      - IOC_MATCH_ENABLED=${IOC_MATCH_ENABLED:-true}
      - IOC_CACHE_PATH=/app/data/agent/ioc-cache.json
      - IOC_CACHE_STAMP_PATH=/app/data/agent/ioc-cache.stamp
      - IOC_MATCH_COOLDOWN_SEC=${IOC_MATCH_COOLDOWN_SEC:-300}
      - CAPTURE_BACKEND=${CAPTURE_BACKEND:-scapy}
      - XDP_MODE=${XDP_MODE:-native}
      - XDP_QUEUE_ID=${XDP_QUEUE_ID:-0}
      - AF_XDP_FRAME_SIZE=${AF_XDP_FRAME_SIZE:-2048}
      - AF_XDP_NUM_FRAMES=${AF_XDP_NUM_FRAMES:-4096}
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - BPF
      - IPC_LOCK
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    depends_on:
      - local-mqtt
      - sensel-edge-agent

networks:
  sensel-edge:
    driver: bridge
  edgex-network:
    driver: bridge

volumes:
  edgex-db:
