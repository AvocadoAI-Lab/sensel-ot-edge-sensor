name: P3 Site Node

on:
  pull_request:
    paths:
      - "services/sensel-site/**"
      - "services/sensel-edge-agent/sensel/**"
      - "config/model/feature-contract.*.json"
      - "config/model/trainer-policy.*.json"
      - "docker-compose.site.yml"
      - ".env.site.example"
      - ".github/workflows/p3-site-node.yml"
  push:
    branches:
      - main
    paths:
      - "services/sensel-site/**"
      - "services/sensel-edge-agent/sensel/**"
      - "config/model/feature-contract.*.json"
      - "config/model/trainer-policy.*.json"
      - "docker-compose.site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-lineage-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/sensel-site/requirements.txt

      - name: Install Site dependencies
        run: pip install -r services/sensel-site/requirements.txt pytest ruff

      - name: Verify Site ingestion and trainer boundary
        env:
          PYTHONPATH: services/sensel-site:services/sensel-edge-agent
        run: |
          ruff check services/sensel-site
          pytest -q services/sensel-site/tests/test_site_p3a.py

      - name: Validate Site deployment profile
        run: |
          docker compose --env-file .env.site.example -f docker-compose.site.yml config >/dev/null
          docker compose --env-file .env.site.example -f docker-compose.site.yml --profile training config >/dev/null
          docker compose --env-file .env.site.example -f docker-compose.site.yml --profile model-release config >/dev/null

  xgboost-candidate-boundary:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned XGBoost worker test image
        run: >-
          docker build --target test
          -f services/sensel-site/Dockerfile.worker
          -t sensel-site-worker:p3c-test .

      - name: Build minimal release signer test image
        run: >-
          docker build --target test
          -f services/sensel-site/Dockerfile.release
          -t sensel-site-release:p3c-test .

      - name: Train, validate, convert, benchmark, and gate release without network
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:size=512m,mode=1777
          -v "$PWD:/workspace:ro" -w /workspace
          -e PYTHONPATH=/workspace/services/sensel-site:/workspace/services/sensel-edge-agent
          sensel-site-worker:p3c-test
          python -m pytest -q -p no:cacheprovider
          services/sensel-site/tests/test_site_p3b.py
          services/sensel-site/tests/test_site_p3c.py

      - name: Assert release signer contains no model parser
        run: |
          docker run --rm --network none --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            sensel-site-release:p3c-test python -c \
            "import importlib.util, sensel_site.release_signer; names=('xgboost','onnx','onnxruntime','onnxmltools'); assert all(importlib.util.find_spec(name) is None for name in names)"
