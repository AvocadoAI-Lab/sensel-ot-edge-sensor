# Example OPC UA device — copy via Console wizard or rename for manual deploy.
# Requires: docker compose --profile phase2 up -d device-opc-ua

deviceList:
  - name: opcua-demo-01
    profileName: OPCUASample
    description: OPC UA PLC (lab / field)
    adminState: UNLOCKED
    operatingState: UP
    serviceName: device-opc-ua
    labels: [ot, opcua, lab]
    protocols:
      opc-ua:
        Endpoint: "opc.tcp://192.168.1.50:4840"
        SecurityPolicy: "None"
        SecurityMode: "None"
        AuthMode: "Anonymous"
    autoEvents:
      - interval: 10s
        onChange: false
        sourceName: AllResources
