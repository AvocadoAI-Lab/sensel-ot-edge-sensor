# Pi lab overlay — mock SenseL API + events viewer + Edge Console
# With lab-61850 overlay: EdgeX = mqtt-feature only (see docker-compose.lab-61850.yml)
# Optional: COMPOSE_PROFILES=modbus-lab or phase2 for Modbus / OPC UA / S7
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.pi4.yml \
#     -f docker-compose.pi-lab.yml -f docker-compose.lab-61850.yml up -d
#
# Edge Console (setup wizard): http://<pi-ip>:8090
# Events UI (legacy):         http://<pi-ip>:8080

services:
  mock-sensel:
    build:
      context: .
      dockerfile: lab/mock-sensel/Dockerfile
    container_name: sensel-mock-api
    restart: unless-stopped
    volumes:
      - ./data/assets:/data/assets
    ports:
      - "8765:8765"
    networks:
      - sensel-edge

  events-viewer:
    build:
      context: .
      dockerfile: lab/events-viewer/Dockerfile
    container_name: sensel-events-viewer
    restart: unless-stopped
    volumes:
      - ./data/assets:/data/assets:ro
    ports:
      - "8080:8080"
    networks:
      - sensel-edge

  sensel-edge-agent:
    environment:
      - SENSEL_VERIFY_TLS=false

  edge-console:
    mem_limit: 384m

  packet-sensor:
    privileged: true
    environment:
      - LOCAL_MQTT_HOST=127.0.0.1
      - LOCAL_MQTT_PORT=1884
      - CAPTURE_INTERFACE=${CAPTURE_INTERFACE:-eth0}
      - CAPTURE_BPF_FILTER=${CAPTURE_BPF_FILTER:-(ether proto 0x88b8) or (tcp port 102) or (udp port 53) or (tcp port 389)}
      - DEPLOY_TARGET=pi4
